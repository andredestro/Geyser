name: Build experimental standalone

on:
  workflow_dispatch:
  push:
    branches:
      - fix/nethernet-lan-discovery-pr6896

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone and test LAN candidate
        run: |
          ./gradlew :standalone:shadowJar :core:test \
            --tests org.geysermc.geyser.configuration.ConfigLoaderTest \
            --tests org.geysermc.geyser.network.bedrock.nethernet.LanBindRetryTest \
            --tests org.geysermc.geyser.network.bedrock.nethernet.LanLoginPolicyTest \
            --tests org.geysermc.geyser.network.bedrock.nethernet.UnsignedAnswerSignalingTest \
            --tests org.geysermc.geyser.util.LanLoginIdentityTest

      - name: Upload standalone JAR
        uses: actions/upload-artifact@v4
        with:
          name: geyser-standalone
          path: bootstrap/standalone/build/libs/Geyser-Standalone.jar
          if-no-files-found: error
          retention-days: 7
